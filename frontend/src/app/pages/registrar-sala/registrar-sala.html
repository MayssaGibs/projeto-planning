<div class="container-pagina">
  <button type="button" class="btn-voltar" (click)="voltar()">← Voltar</button>

  <h1 class="titulo-pagina">Cadastrar sala</h1>

  <div class="card-cadastro">
    <form [formGroup]="form" (ngSubmit)="adicionar()">
      <div class="form-grid">
        <!-- Nome (Topo Esquerda) -->
        <div class="campo campo-nome">
          <label for="nome">Nome</label>
          <input id="nome" type="text" formControlName="nome" />
          @if (invalido('nome')) {
            <small class="erro">Informe o nome da sala.</small>
          }
        </div>

        <!-- Número da sala (Baixo Esquerda) -->
        <div class="campo campo-numero">
          <label for="numero">Número da sala</label>
          <input id="numero" type="number" formControlName="numero" />
          @if (invalido('numero')) {
            <small class="erro">Informe um número válido.</small>
          }
        </div>

        <!-- Tipo de sala (Baixo Direita) -->
        <div class="campo campo-tipo">
          <label for="tipo">Tipo de sala</label>
          <select id="tipo" formControlName="tipo">
            <option value="" disabled selected></option>
            <option value="aula">Sala de aula</option>
            <option value="laboratorio">Laboratório</option>
            <option value="auditorio">Auditório</option>
          </select>
          @if (invalido('tipo')) {
            <small class="erro">Selecione o tipo.</small>
          }
        </div>
      </div>

      <!-- Botões Centralizados -->
      <div class="acoes">
        <button type="submit" class="btn btn-adicionar">Adicionar</button>
        <button type="button" class="btn btn-cancelar" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
</div>
