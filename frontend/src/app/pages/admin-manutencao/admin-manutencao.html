<header class="topbar">
  <div class="brand-small">⌛</div>

  <div class="search-box">
    <span>⌕</span>
    <input
      type="search"
      placeholder="Buscar..."
      aria-label="Buscar manutenções"
      [(ngModel)]="searchTerm"
    />
  </div>

  <div class="top-actions">
    <button
      type="button"
      class="notification"
      aria-label="Notificações"
      (click)="showNotifications()"
    >
      ♧
    </button>

    <button
      type="button"
      class="top-avatar"
      aria-label="Perfil do utilizador"
      (click)="showProfile()"
    >
      D
    </button>
  </div>
</header>

<div class="manutencao-container">

  <!-- TÍTULO DA PÁGINA -->
  <div class="manutencao-title">
    <h1>MANUTENÇÃO</h1>

    <div class="manutencao-decoration">
      <span></span>
      <strong>✦</strong>
      <span></span>
    </div>
  </div>

  <!-- PAINEL CENTRAL / FORMULÁRIO -->
  <section class="form-card">
    <form (ngSubmit)="saveMaintenance()">
      
      <!-- Campo: Nome -->
      <div class="form-group full-width">
        <label for="nome">Nome</label>
        <input 
          type="text" 
          id="nome" 
          name="nome" 
          [(ngModel)]="newManutencaoData.nome" 
          required
        >
      </div>

      <!-- Linha com Dois Campos: Número e Tipo -->
      <div class="form-row">
        <div class="form-group">
          <label for="roomNumber">Número da sala</label>
          <input 
            type="text" 
            id="roomNumber" 
            name="roomNumber" 
            [(ngModel)]="newManutencaoData.roomNumber" 
            required
          >
        </div>

        <div class="form-group">
          <label for="roomType">Tipo de sala</label>
          <input 
            type="text" 
            id="roomType" 
            name="roomType" 
            [(ngModel)]="newManutencaoData.roomType" 
            required
          >
        </div>
      </div>

      <!-- Campo: Dias em Manutenção -->
      <div class="form-group full-width">
        <label for="maintenanceDays">Dias em manutenção</label>
        <div class="input-with-icon">
          <input 
            type="text" 
            id="maintenanceDays" 
            name="maintenanceDays" 
            [(ngModel)]="newManutencaoData.maintenanceDays" 
            required
          >
          <span class="calendar-icon">📅</span>
        </div>
      </div>

      <!-- Botão de Ação -->
      <div class="form-actions">
        <button type="submit" class="btn-salvar">Salvar Registro</button>
      </div>

    </form>
  </section>

</div>
