
<!-- SIDEBAR COMPARTILHADA DO ADMINISTRADOR -->
<app-admin-sidebar></app-admin-sidebar>

<!-- BARRA SUPERIOR -->
<header class="topbar">

  <div class="brand-small">⌛</div>

  <div class="search-box">
    <span>⌕</span>

    <input
      type="search"
      placeholder="Buscar..."
      aria-label="Buscar manutenções"
      [(ngModel)]="searchTerm"
    />
  </div>

  <div class="top-actions">

    <!-- NOTIFICAÇÕES -->
    <button
      type="button"
      class="notification"
      aria-label="Notificações"
      (click)="showNotifications()"
    >
      ♧
    </button>

    <!-- EDITAR PERFIL DO ADMIN -->
    <a
      class="top-avatar"
      routerLink="/editar-perfil"
      title="Editar meu perfil"
      aria-label="Editar perfil do David"
    >
      D
    </a>

  </div>
</header>

<!-- CONTEÚDO DA PÁGINA -->
<div class="manutencao-container">

  <!-- TÍTULO -->
  <div class="manutencao-title">

    <h1>MANUTENÇÃO</h1>

    <div class="manutencao-decoration">
      <span></span>
      <strong>✦</strong>
      <span></span>
    </div>

  </div>

  <!-- FORMULÁRIO -->
  <section class="form-card">

    <form (ngSubmit)="saveMaintenance()">

      <!-- NOME -->
      <div class="form-group full-width">
        <label for="nome">Nome</label>

        <input
          type="text"
          id="nome"
          name="nome"
          [(ngModel)]="newManutencaoData.nome"
          required
        />
      </div>

      <!-- NÚMERO E TIPO DA SALA -->
      <div class="form-row">

        <div class="form-group">
          <label for="roomNumber">Número da sala</label>

          <input
            type="text"
            id="roomNumber"
            name="roomNumber"
            [(ngModel)]="newManutencaoData.roomNumber"
            required
          />
        </div>

        <div class="form-group">
          <label for="roomType">Tipo de sala</label>

          <input
            type="text"
            id="roomType"
            name="roomType"
            [(ngModel)]="newManutencaoData.roomType"
            required
          />
        </div>

      </div>

      <!-- DIAS EM MANUTENÇÃO -->
      <div class="form-group full-width">

        <label for="maintenanceDays">
          Dias em manutenção
        </label>

        <div class="input-with-icon">

          <input
            type="text"
            id="maintenanceDays"
            name="maintenanceDays"
            [(ngModel)]="newManutencaoData.maintenanceDays"
            required
          />

          <span class="calendar-icon">📅</span>

        </div>
      </div>

      <!-- SALVAR -->
      <div class="form-actions">
        <button
          type="submit"
          class="btn-salvar"
        >
          Salvar Registro
        </button>
      </div>

    </form>

  </section>

</div>
