
<div class="perfil-container">

  <h1>Editar perfil</h1>

  <div class="perfil-card">

    <div class="campo">
      <label for="nome">Nome</label>
      <input
        id="nome"
        name="nome"
        type="text"
        [(ngModel)]="nome"
        placeholder="Digite seu nome"
      />
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        placeholder="Digite seu e-mail"
      />
    </div>

    <div class="campo">
      <label for="tipo">Tipo de usuário</label>

      <select
        id="tipo"
        name="tipo"
        [(ngModel)]="tipoUsuario">

        <option value="funcionario">Funcionário</option>
        <option value="administrador">Administrador</option>

      </select>
    </div>

    @if (isFuncionario()) {

      <div class="dados-funcionario">

        <h2>Dados do funcionário</h2>

        <div class="campo">
          <label for="matricula">Matrícula</label>

          <input
            id="matricula"
            name="matricula"
            type="text"
            [(ngModel)]="matricula"
            placeholder="Digite sua matrícula"
          />
        </div>

        <div class="campo">
          <label for="setor">Setor</label>

          <input
            id="setor"
            name="setor"
            type="text"
            [(ngModel)]="setor"
            placeholder="Digite seu setor"
          />
        </div>

      </div>

    }

    @if (isAdministrador()) {

      <div class="dados-administrador">

        <h2>Dados do administrador</h2>

        <div class="campo">
          <label for="cargo">Cargo</label>

          <input
            id="cargo"
            name="cargo"
            type="text"
            [(ngModel)]="cargo"
            placeholder="Digite seu cargo"
          />
        </div>

        <div class="campo">
          <label for="permissao">Permissão</label>

          <select
            id="permissao"
            name="permissao"
            [(ngModel)]="permissao">

            <option value="total">Acesso total</option>
            <option value="reservas">Gerenciar reservas</option>

          </select>
        </div>

      </div>

    }

    <div class="dados-senha">


      <div class="campo">
        <label for="novaSenha">Nova senha</label>

        <input
          id="novaSenha"
          name="novaSenha"
          type="password"
          [(ngModel)]="novaSenha"
          autocomplete="new-password"
          placeholder="Digite a nova senha"
        />
      </div>

      <div class="campo">
        <label for="confirmarSenha">Confirmar nova senha</label>

        <input
          id="confirmarSenha"
          name="confirmarSenha"
          type="password"
          [(ngModel)]="confirmarSenha"
          autocomplete="new-password"
          placeholder="Confirme a nova senha"
        />
      </div>

      <button
        type="button"
        (click)="validarSenha()">
        Alterar senha
      </button>

      @if (mensagemSenha) {
        <p>{{ mensagemSenha }}</p>
      }

    </div>

    <!-- ADICIONADO: botão para salvar o perfil -->
    <button
      type="button"
      class="btn-principal"
      (click)="salvarPerfil()">
      Salvar alterações
    </button>

  </div>

</div>
