<section class="pagina">
  <button type="button" class="btn-voltar" (click)="voltar()">← Voltar</button>

  <h1 class="titulo">Cadastrar sala</h1>

  <form class="formulario" [formGroup]="form" (ngSubmit)="adicionar()">
    <div class="grade">
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" type="text" formControlName="nome" />
        <small class="erro" *ngIf="invalido('nome')">Informe o nome da sala.</small>
      </div>

      <div class="campo vazio"></div>

      <div class="campo">
        <label for="numero">Número da sala</label>
        <input id="numero" type="number" formControlName="numero" />
        <small class="erro" *ngIf="invalido('numero')">Informe um número válido.</small>
      </div>

      <div class="campo">
        <label for="tipo">Tipo de sala</label>
        <select id="tipo" formControlName="tipo">
          <option value="">Selecione</option>
          <option value="aula">Sala de aula</option>
          <option value="laboratorio">Laboratório</option>
          <option value="auditorio">Auditório</option>
        </select>
        <small class="erro" *ngIf="invalido('tipo')">Selecione o tipo.</small>
      </div>
    </div>

    <div class="acoes">
      <button type="submit" class="btn btn-adicionar">Adicionar</button>
      <button type="button" class="btn btn-cancelar" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</section>
